title: SeisComP containers lab
description: >-
  Unofficial LEARN SeisComP lab as one Docker Compose service per process
  using gsm on AWS Ubuntu.

theme: just-the-docs

url: https://seiscomp-containers-lab.johna.kiwi
baseurl: ""

permalink: pretty

heading_anchors: true
back_to_top: false

aux_links:
  GitHub: https://github.com/jajera/seiscomp-containers-lab
aux_links_new_tab: true

color_scheme: conduit

favicon_ico: "/assets/images/favicon.ico"

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

twitter:
  card: summary_large_image

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

callouts_level: loud
callouts:
  finding:
    title: Finding
    color: green
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: purple
  warning:
    title: Warning
    color: yellow
  blocked:
    title: Not possible today
    color: red
  cost:
    title: Cost
    color: red

footer_content: >-
  Unofficial learning lab. Not gempa-supported. Not a production SeisComP
  network. Software from the public gsm repository (AGPL). Tear down AWS
  resources when finished.

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
