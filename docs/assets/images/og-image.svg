<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SeisComP containers lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f6f5"/>
      <stop offset="55%" stop-color="#e7f1f3"/>
      <stop offset="100%" stop-color="#dce8ec"/>
    </linearGradient>
    <radialGradient id="glowA" cx="12%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="100%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <text x="72" y="88" fill="#0e7490" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="28" font-weight="700" letter-spacing="0.04em">jajera</text>
