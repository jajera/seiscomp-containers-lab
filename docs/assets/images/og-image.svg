  <text x="72" y="278" fill="#3d5560" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="24">One Compose service per process</text>
  <text x="72" y="314" fill="#5b7380" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="20">public gsm / GEOFON SeedLink / XFCE sidecar</text>

  <g transform="translate(72 380)">
