    <text x="548" y="62" text-anchor="middle" fill="#3d5560" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14">MariaDB / FDSNWS</text>
  </g>

  <g transform="translate(760 118)">
    <rect width="368" height="394" rx="28" fill="#ffffff" stroke="#c9d6d2"/>
    <rect x="28" y="28" width="312" height="72" rx="14" fill="none" stroke="#0e7490" stroke-width="3"/>
    <text x="184" y="72" text-anchor="middle" fill="#0e7490" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="18" font-weight="700">seedlink</text>
