    <text x="84" y="62" text-anchor="middle" fill="#3d5560" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14">SeedLink :18000</text>

    <path d="M180 44h36" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
    <path d="M204 36l12 8-12 8" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="228" width="176" height="88" rx="16" fill="#0e7490"/>
    <text x="316" y="38" text-anchor="middle" fill="#f5fffd" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="16" font-weight="700">Compose</text>
    <text x="316" y="62" text-anchor="middle" fill="#d8ebe7" font-family="Noto Sans, Liberation Sans, sans-serif" font-size="14">one process each</text>

    <path d="M416 44h36" stroke="#0e7490" stroke-width="3" stroke-linecap="round"/>
    <path d="M440 36l12 8-12 8" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

